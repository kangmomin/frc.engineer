name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go Test with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: frc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d frc_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GOTOOLCHAIN: local
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/frc_test?sslmode=disable
      TEST_DB_SCHEMA: ban_test
      PLATFORM_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/frc_test?sslmode=disable
      PLATFORM_UPGRADE_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/frc_upgrade_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: npm ci
        working-directory: web

      - name: Build web (required for go:embed)
        run: npm run build
        working-directory: web

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Create separate migration upgrade database
        env:
          PGPASSWORD: postgres
        run: createdb -h 127.0.0.1 -U postgres frc_upgrade_test

      # DB tests truncate shared tables; serialize packages using this test DB.
      - name: Test including DB integration and upgrade
        run: go test -race -p 1 ./...

      - name: Test update log Python publisher
        run: python3 -B -m unittest discover -s .codex/skills/publish-update-log/scripts -p 'test_*.py'

      - name: Audit reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  frontend:
    name: Web Test, Lint And Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci
        working-directory: web

      - name: Audit dependencies
        run: npm audit --audit-level=low
        working-directory: web

      - name: Lint
        run: npm run lint
        working-directory: web

      - name: Test
        run: npm test
        working-directory: web

      - name: Install Driver Pack analysis test dependencies
        run: npm ci --ignore-scripts
        working-directory: apps/setup-manager

      - name: Test Driver Pack analysis
        run: node web/node_modules/vitest/vitest.mjs run --config apps/setup-manager/analysis.vitest.config.mjs

      - name: Browser lifecycle and native WebRTC regressions
        run: npm run test:browser
        working-directory: web
        env:
          CHROME_BIN: /usr/bin/google-chrome

      - name: Build
        run: npm run build
        working-directory: web

  driver-pack:
    name: Driver Pack Test, Typecheck And Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/setup-manager/package-lock.json

      - name: Install
        run: npm ci
        working-directory: apps/setup-manager

      - name: Test
        run: npm test
        working-directory: apps/setup-manager

      - name: Audit dependencies
        run: npm audit --audit-level=low
        working-directory: apps/setup-manager

      - name: Typecheck
        run: npm run typecheck
        working-directory: apps/setup-manager

      - name: Build
        run: npm run build
        working-directory: apps/setup-manager

  windows:
    name: Windows Sender lifecycle and Driver Pack installer
    runs-on: windows-latest
    env:
      GOTOOLCHAIN: local
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/setup-manager/package-lock.json
      - name: Native Windows storage, cancellation, and Sender regressions
        run: go test ./cmd/sender ./internal/telemetry ./internal/races ./internal/rtc
      - name: Build Windows GUI Sender
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/artifacts | Out-Null
          go build -ldflags "-H windowsgui" -o build/artifacts/frc-pitwall-sender.exe ./cmd/sender
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go version -m build/artifacts/frc-pitwall-sender.exe
      - name: Native Sender startup and status API
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          New-Item -ItemType Directory $smokeRoot | Out-Null
          $env:FRC_STORAGE_DIR = $smokeRoot
          $env:FRC_NO_BROWSER = '1'
          $env:DRIVER_PACK_EMBEDDED = '1'
          $env:SETTINGS_PORT = '58099'
          $env:F1_UDP_PORT = '52077'
          $env:SIGNALING_URL = 'ws://127.0.0.1:59998/ws'
          $sender = Start-Process -FilePath (Resolve-Path build/artifacts/frc-pitwall-sender.exe) -PassThru -RedirectStandardError "$smokeRoot/stderr.log" -RedirectStandardOutput "$smokeRoot/stdout.log"
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($sender.HasExited) { throw "Sender exited before API startup: $($sender.ExitCode)" }
              try { $status = Invoke-RestMethod 'http://127.0.0.1:58099/api/status' -TimeoutSec 1 } catch { Start-Sleep -Seconds 1; continue }
              if ($status.udpPort -ne 52077 -or $status.paired -ne $false) { throw 'Unexpected Sender status' }
              $debug = Invoke-RestMethod 'http://127.0.0.1:58099/api/debug' -TimeoutSec 3
              $expectedVersion = 'v' + (Get-Content apps/setup-manager/package.json | ConvertFrom-Json).version
              if ($debug.version -ne $expectedVersion) { throw "Unexpected Sender version: $($debug.version)" }
              $ready = $true
              break
            }
            if (-not $ready) { throw 'Sender status API did not become ready within 30 attempts' }
            Write-Host "Sender $expectedVersion started and served status/debug APIs"
          } finally {
            if (-not $sender.HasExited) { Stop-Process -Id $sender.Id -Force }
            $sender.WaitForExit()
            Get-Content "$smokeRoot/stderr.log", "$smokeRoot/logs/sender.log" -ErrorAction SilentlyContinue
            Remove-Item $smokeRoot -Recurse -Force
          }
      - name: Install Driver Pack dependencies
        run: npm ci
        working-directory: apps/setup-manager
      - name: Native child shutdown, restart and update handoff
        run: npm test
        working-directory: apps/setup-manager
      - name: Package Windows installer without publishing
        run: npm run dist:win:unsigned -- --publish never
        working-directory: apps/setup-manager
      - name: Native Electron packaged renderer and quit
        run: node scripts/smoke-electron.cjs release/win-unpacked/resources/app.asar
        working-directory: apps/setup-manager
      - uses: actions/upload-artifact@v4
        with:
          name: windows-driver-pack
          path: |
            apps/setup-manager/release/Minmo-Driver-Pack-Setup.exe
            apps/setup-manager/release/Minmo-Driver-Pack-Setup.exe.blockmap
            apps/setup-manager/release/latest.yml
            build/artifacts/frc-pitwall-sender.exe
