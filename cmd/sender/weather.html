<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Forecast</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0b;
    color: #e0e0e0;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    overflow: hidden;
    user-select: none;
    -webkit-app-region: drag;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }
  .header-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    font-weight: 700;
    color: #00d2ff;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .header-current {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem;
    font-weight: 600;
    color: #bac9cc;
  }
  .header-current .icon { width: 18px; height: 18px; }

  .current-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 8px 16px;
    background: linear-gradient(90deg, rgba(0,210,255,0.08), transparent);
    border-bottom: 1px solid #1a1a1a;
    flex-shrink: 0;
  }
  .current-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .current-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.45rem;
    color: #555;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .current-value {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #e5e2e3;
  }

  .col-header {
    display: grid;
    grid-template-columns: 52px 1fr 60px 60px 54px;
    align-items: center;
    gap: 4px;
    padding: 6px 16px 4px;
    border-bottom: 1px solid #111;
    flex-shrink: 0;
  }
  .col-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.4rem;
    color: #444;
    letter-spacing: 1.2px;
    text-transform: uppercase;
  }
  .col-label:last-child { text-align: right; }

  .forecast-list {
    flex: 1;
    overflow-y: auto;
    -webkit-app-region: no-drag;
    scrollbar-width: thin;
    scrollbar-color: rgba(0,210,255,0.3) #111;
  }
  .forecast-list::-webkit-scrollbar { width: 4px; }
  .forecast-list::-webkit-scrollbar-track { background: #111; }
  .forecast-list::-webkit-scrollbar-thumb { background: rgba(0,210,255,0.3); border-radius: 2px; }

  .row {
    display: grid;
    grid-template-columns: 52px 1fr 60px 60px 54px;
    align-items: center;
    gap: 4px;
    padding: 7px 16px;
    transition: background 0.15s;
    border-left: 2px solid transparent;
  }
  .row:hover { background: rgba(0,210,255,0.04); }
  .row.rain-high { background: rgba(255,60,60,0.06); }
  .row.first { background: rgba(0,210,255,0.06); border-left-color: #00d2ff; }

  .time-cell {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: #e5e2e3;
  }
  .row.first .time-cell { color: #00d2ff; }

  .cond-cell {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cond-icon { width: 20px; height: 20px; flex-shrink: 0; }
  .cond-icon svg {
    width: 100%; height: 100%;
    fill: none; stroke: currentColor;
    stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
  }
  .cond-icon svg circle { fill: currentColor; stroke: none; }
  .cond-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .temp-cell {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  .temp-label {
    font-size: 0.55rem;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .temp-value {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.9rem;
    font-weight: 700;
    color: #e5e2e3;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .trend-up { color: #ff525c; font-size: 0.65rem; }
  .trend-down { color: #00d2ff; font-size: 0.65rem; }

  .rain-cell {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 3px;
  }
  .rain-pct {
    font-family: 'Rajdhani', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    line-height: 1;
  }
  .rain-bar {
    width: 42px;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }
  .rain-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .rain-low .rain-pct { color: #00d2ff; }
  .rain-low .rain-bar-fill { background: #00d2ff; }
  .rain-med .rain-pct { color: #ffb3b2; }
  .rain-med .rain-bar-fill { background: #ffb3b2; }
  .rain-high .rain-pct { color: #ff525c; }
  .rain-high .rain-bar-fill { background: #ff525c; }

  .empty {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #333;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.6rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 6px 12px;
    border-top: 1px solid #1a1a1a;
    flex-shrink: 0;
    -webkit-app-region: no-drag;
  }
  .controls label {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.5rem;
    color: #555;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .controls input[type="range"] { width: 80px; accent-color: #00d2ff; }
  .range-val {
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.75rem;
    color: #00d2ff;
    min-width: 32px;
    text-align: right;
  }

  .status {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.45rem;
    color: #333;
    text-align: center;
    padding-bottom: 4px;
    letter-spacing: 1px;
  }

  /* Color classes for conditions */
  .cond-clear { color: #cdff13; }
  .cond-cloud { color: #c3f5ff; }
  .cond-rain { color: #00d2ff; }
  .cond-heavy { color: #ffb3b2; }
  .cond-storm { color: #ff525c; }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">Weather Forecast</span>
  <span class="header-current" id="currentWeather">--</span>
</div>

<div class="current-bar" id="currentBar">
  <div class="current-item">
    <span class="current-label">Track</span>
    <span class="current-value" id="trackTemp">--</span>
  </div>
  <div class="current-item">
    <span class="current-label">Air</span>
    <span class="current-value" id="airTemp">--</span>
  </div>
  <div class="current-item">
    <span class="current-label">Session</span>
    <span class="current-value" id="sessionType">--</span>
  </div>
</div>

<div class="col-header">
  <span class="col-label">Time</span>
  <span class="col-label">Condition</span>
  <span class="col-label">Track</span>
  <span class="col-label">Air</span>
  <span class="col-label">Rain</span>
</div>

<div class="forecast-list" id="forecastList">
  <div class="empty">Connecting...</div>
</div>

<div class="controls">
  <label>BG</label>
  <input type="range" id="bgSlider" min="0" max="100" value="100" step="5">
  <span class="range-val" id="bgVal">100%</span>
</div>
<div class="status" id="status">CONNECTING</div>

<script>
(function() {
  const forecastList = document.getElementById('forecastList');
  const currentWeather = document.getElementById('currentWeather');
  const trackTemp = document.getElementById('trackTemp');
  const airTemp = document.getElementById('airTemp');
  const sessionType = document.getElementById('sessionType');
  const statusEl = document.getElementById('status');
  const bgSlider = document.getElementById('bgSlider');
  const bgVal = document.getElementById('bgVal');

  let bgOpacity = 1.0;

  bgSlider.addEventListener('input', function() {
    bgOpacity = parseInt(this.value) / 100;
    bgVal.textContent = this.value + '%';
    document.body.style.background = `rgba(10,10,11,${bgOpacity})`;
  });

  const WEATHER_ICONS = {
    clear: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M19.4 4.6l-2.1 2.1M6.7 17.3l-2.1 2.1"/></svg>',
    light_cloud: '<svg viewBox="0 0 24 24"><path d="M7.5 18.5h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.4 9.3 3.8 3.8 0 0 0 7.5 18.5Z"/></svg>',
    overcast: '<svg viewBox="0 0 24 24"><path d="M7.5 18.5h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.4 9.3 3.8 3.8 0 0 0 7.5 18.5Z"/></svg>',
    light_rain: '<svg viewBox="0 0 24 24"><path d="M7.5 15.5h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.4 6.3 3.8 3.8 0 0 0 7.5 15.5Z"/><path d="M9 17.5l-1 3M13 17.5l-1 3M17 17.5l-1 3"/></svg>',
    heavy_rain: '<svg viewBox="0 0 24 24"><path d="M7.5 15.5h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.4 6.3 3.8 3.8 0 0 0 7.5 15.5Z"/><path d="M9 17.5l-1 3M13 17.5l-1 3M17 17.5l-1 3"/></svg>',
    storm: '<svg viewBox="0 0 24 24"><path d="M7.5 15.5h9a4 4 0 0 0 .4-8A5.5 5.5 0 0 0 6.4 6.3 3.8 3.8 0 0 0 7.5 15.5Z"/><path d="M13 16l-2 4h4l-2 4"/></svg>',
  };

  const WEATHER_LABELS = {
    clear: 'Clear', light_cloud: 'Light Cloud', overcast: 'Overcast',
    light_rain: 'Light Rain', heavy_rain: 'Heavy Rain', storm: 'Storm',
  };

  const COND_CLASS = {
    clear: 'cond-clear', light_cloud: 'cond-cloud', overcast: 'cond-cloud',
    light_rain: 'cond-rain', heavy_rain: 'cond-heavy', storm: 'cond-storm',
  };

  function rainClass(pct) {
    if (pct >= 60) return 'rain-high';
    if (pct >= 30) return 'rain-med';
    return 'rain-low';
  }

  function trendHtml(change) {
    if (change > 0) return '<span class="trend-up">&#9650;</span>';
    if (change < 0) return '<span class="trend-down">&#9660;</span>';
    return '';
  }

  function render(data) {
    // Current conditions
    currentWeather.innerHTML =
      '<span class="' + (COND_CLASS[data.currentWeather] || '') + '">' +
      (WEATHER_LABELS[data.currentWeather] || data.currentWeather) + '</span>';
    trackTemp.textContent = data.trackTemp.toFixed(1) + '\u00B0C';
    airTemp.textContent = data.airTemp.toFixed(1) + '\u00B0C';
    sessionType.textContent = data.sessionType || '--';

    // Forecast list
    if (!data.forecasts || data.forecasts.length === 0) {
      forecastList.innerHTML = '<div class="empty">No forecast data</div>';
      return;
    }

    let html = '';
    data.forecasts.forEach(function(f, i) {
      const rc = rainClass(f.rainPercentage);
      const cc = COND_CLASS[f.weather] || '';
      const isFirst = i === 0;
      const rowCls = 'row' + (isFirst ? ' first' : '') + (f.rainPercentage >= 50 ? ' rain-high' : '');

      html += '<div class="' + rowCls + '">';

      // Time
      html += '<div class="time-cell">+' + f.timeOffset + 'M</div>';

      // Condition
      html += '<div class="cond-cell">';
      html += '<div class="cond-icon ' + cc + '">' + (WEATHER_ICONS[f.weather] || '') + '</div>';
      html += '<span class="cond-label ' + cc + '">' + (WEATHER_LABELS[f.weather] || f.weather) + '</span>';
      html += '</div>';

      // Track temp
      html += '<div class="temp-cell">';
      html += '<span class="temp-label">Track</span>';
      html += '<span class="temp-value">' + f.trackTemp.toFixed(0) + '\u00B0' + trendHtml(f.trackTempChange) + '</span>';
      html += '</div>';

      // Air temp
      html += '<div class="temp-cell">';
      html += '<span class="temp-label">Air</span>';
      html += '<span class="temp-value">' + f.airTemp.toFixed(0) + '\u00B0' + trendHtml(f.airTempChange) + '</span>';
      html += '</div>';

      // Rain
      html += '<div class="rain-cell ' + rc + '">';
      html += '<span class="rain-pct">' + f.rainPercentage + '%</span>';
      html += '<div class="rain-bar"><div class="rain-bar-fill" style="width:' + f.rainPercentage + '%"></div></div>';
      html += '</div>';

      html += '</div>';
    });

    forecastList.innerHTML = html;
  }

  // SSE connection
  function connect() {
    statusEl.textContent = 'CONNECTING';
    statusEl.style.color = '#333';
    const es = new EventSource('/api/weather/stream');

    es.onopen = function() {
      statusEl.textContent = 'LIVE';
      statusEl.style.color = '#00d2ff';
    };

    es.onmessage = function(e) {
      try {
        const data = JSON.parse(e.data);
        render(data);
      } catch(err) {}
    };

    es.onerror = function() {
      statusEl.textContent = 'RECONNECTING';
      statusEl.style.color = '#e74c3c';
      es.close();
      setTimeout(connect, 2000);
    };
  }

  connect();
})();
</script>
</body>
</html>
