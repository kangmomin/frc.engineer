<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Sender Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050505;
    color: #e0e0e0;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .container { width: 100%; max-width: 420px; }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem;
    color: #00d2ff;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 28px;
    text-align: center;
  }

  .section {
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
  }

  /* Status */
  .room-code {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: #00d2ff;
    text-align: center;
    letter-spacing: 8px;
    margin-bottom: 12px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 1rem;
  }
  .stat-label { color: #888; }
  .stat-value { color: #e0e0e0; font-weight: 600; }

  /* Settings form */
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input[type="number"],
  .field input[type="password"] {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e0e0e0;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input[type="number"]:focus,
  .field input[type="password"]:focus {
    border-color: #00d2ff;
  }

  /* Toggle switch */
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    cursor: pointer;
  }
  .toggle input { display: none; }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: #333;
    border-radius: 12px;
    transition: background 0.2s;
  }
  .toggle .slider::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    background: #888;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .slider {
    background: #00d2ff33;
  }
  .toggle input:checked + .slider::after {
    transform: translateX(20px);
    background: #00d2ff;
  }

  /* Tracks */
  .tracks-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .tracks-count {
    font-size: 1.1rem;
    font-weight: 600;
  }
  .tracks-count .loaded { color: #00d2ff; }
  .tracks-count .total { color: #666; }
  .track-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .track-tag {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 3px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .track-tag.ok {
    background: #00d2ff15;
    color: #00d2ff;
    border: 1px solid #00d2ff33;
  }
  .track-tag.missing {
    background: #e74c3c15;
    color: #e74c3c;
    border: 1px solid #e74c3c33;
  }

  /* Forwarding */
  .fwd-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .fwd-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .fwd-row input[type="text"],
  .fwd-row input[type="number"] {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e0e0e0;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 6px 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  .fwd-row input[type="text"] { flex: 1; min-width: 0; }
  .fwd-row input[type="number"] { width: 80px; }
  .fwd-row input:focus { border-color: #00d2ff; }
  .fwd-del {
    background: transparent;
    border: 1px solid #e74c3c44;
    border-radius: 4px;
    color: #e74c3c;
    font-size: 1rem;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .fwd-del:hover { background: #e74c3c22; }
  .fwd-add {
    background: transparent;
    border: 1px dashed #333;
    border-radius: 4px;
    color: #888;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.2s, color 0.2s;
  }
  .fwd-add:hover { border-color: #00d2ff; color: #00d2ff; }
  .fwd-empty {
    color: #555;
    font-size: 0.85rem;
    text-align: center;
    padding: 8px;
  }

  /* Save button */
  .save-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 1px solid #00d2ff;
    border-radius: 6px;
    color: #00d2ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .save-btn:hover {
    background: #00d2ff;
    color: #050505;
  }
  .save-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .secondary-btn {
    display: block;
    width: 100%;
    padding: 10px 12px;
    background: transparent;
    border: 1px solid #444;
    border-radius: 6px;
    color: #bbb;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .secondary-btn:hover {
    border-color: #00d2ff;
    color: #00d2ff;
    background: #00d2ff10;
  }
  .compare-status {
    font-size: 0.95rem;
    font-weight: 700;
  }
  .compare-status.enabled { color: #00d2ff; }
  .compare-status.disabled { color: #888; }
  .compare-actions {
    display: flex;
    gap: 8px;
  }
  .compare-actions .save-btn,
  .compare-actions .secondary-btn {
    width: auto;
    flex: 1;
  }
  .compare-hint {
    margin-top: 8px;
    color: #666;
    font-size: 0.82rem;
    line-height: 1.35;
  }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 0.9rem;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast.ok { border-color: #00d2ff; color: #00d2ff; }
  .toast.err { border-color: #e74c3c; color: #e74c3c; }
</style>
</head>
<body>
<div class="container">
  <h1>Sender Settings</h1>

  <!-- Status -->
  <div class="section">
    <div class="section-title">Status</div>
    <div class="room-code" id="roomCode">----</div>
    <div class="stat-row">
      <span class="stat-label">Connected Engineers</span>
      <span class="stat-value" id="engineers">0</span>
    </div>
  </div>

  <!-- Settings -->
  <div class="section">
    <div class="section-title">Settings</div>
    <div class="field">
      <label for="udpPort">UDP Port</label>
      <input type="number" id="udpPort" min="1" max="65535">
    </div>
    <div class="field">
      <div class="toggle-row">
        <label>Save Files</label>
        <label class="toggle">
          <input type="checkbox" id="saveFiles">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="field">
      <div class="toggle-row">
        <label>Track Recording</label>
        <label class="toggle">
          <input type="checkbox" id="trackRecording">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- UDP Forwarding -->
  <div class="section">
    <div class="section-title">UDP Forwarding</div>
    <div class="fwd-list" id="fwdList"></div>
    <button class="fwd-add" id="fwdAdd">+ Add Target</button>
  </div>

  <!-- Tracks -->
  <div class="section">
    <div class="section-title">Tracks</div>
    <div class="tracks-summary">
      <span class="stat-label">Track Data</span>
      <span class="tracks-count"><span class="loaded" id="tracksLoaded">0</span><span class="total" id="tracksTotal"> / 0</span></span>
    </div>
    <div class="track-list" id="trackList"></div>
  </div>

  <div class="section">
    <div class="section-title">ERS Compare</div>
    <div class="stat-row">
      <span class="stat-label">Comparison Mode</span>
      <span class="compare-status disabled" id="compareStatus">LOCKED</span>
    </div>
    <div class="field">
      <label for="comparePassword">Compare Password</label>
      <input type="password" id="comparePassword" placeholder="Enter sender compare PIN">
      <div class="compare-hint">Use the PIN shown in the sender console, or the value from <code>ERS_COMPARE_PASSWORD</code>.</div>
    </div>
    <div class="compare-actions">
      <button class="save-btn" id="unlockCompareBtn">Unlock</button>
      <button class="secondary-btn" id="lockCompareBtn">Lock</button>
    </div>
  </div>

  <button class="save-btn" id="saveBtn">Save</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const $room = document.getElementById('roomCode');
  const $eng  = document.getElementById('engineers');
  const $port = document.getElementById('udpPort');
  const $save = document.getElementById('saveFiles');
  const $trackRec = document.getElementById('trackRecording');
  const $btn  = document.getElementById('saveBtn');
  const $toast = document.getElementById('toast');
  const $fwdList = document.getElementById('fwdList');
  const $fwdAdd = document.getElementById('fwdAdd');
  const $compareStatus = document.getElementById('compareStatus');
  const $comparePassword = document.getElementById('comparePassword');
  const $unlockCompareBtn = document.getElementById('unlockCompareBtn');
  const $lockCompareBtn = document.getElementById('lockCompareBtn');

  let forwardTargets = [];

  let toastTimer;
  function showToast(msg, ok) {
    clearTimeout(toastTimer);
    $toast.textContent = msg;
    $toast.className = 'toast ' + (ok ? 'ok' : 'err') + ' show';
    toastTimer = setTimeout(() => { $toast.className = 'toast'; }, 2500);
  }

  // Forward targets UI
  function renderForwardTargets() {
    $fwdList.innerHTML = '';
    if (forwardTargets.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'fwd-empty';
      empty.textContent = 'No forwarding targets';
      $fwdList.appendChild(empty);
      return;
    }
    forwardTargets.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'fwd-row';

      const toggle = document.createElement('label');
      toggle.className = 'toggle';
      toggle.style.flexShrink = '0';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.enabled;
      cb.addEventListener('change', () => { forwardTargets[i].enabled = cb.checked; });
      const slider = document.createElement('span');
      slider.className = 'slider';
      toggle.appendChild(cb);
      toggle.appendChild(slider);

      const host = document.createElement('input');
      host.type = 'text';
      host.value = t.host;
      host.placeholder = 'Host / IP';
      host.addEventListener('input', () => { forwardTargets[i].host = host.value; });

      const port = document.createElement('input');
      port.type = 'number';
      port.min = '1';
      port.max = '65535';
      port.value = t.port;
      port.placeholder = 'Port';
      port.addEventListener('input', () => { forwardTargets[i].port = parseInt(port.value, 10) || 0; });

      const del = document.createElement('button');
      del.className = 'fwd-del';
      del.textContent = '\u00d7';
      del.addEventListener('click', () => { forwardTargets.splice(i, 1); renderForwardTargets(); });

      row.appendChild(toggle);
      row.appendChild(host);
      row.appendChild(port);
      row.appendChild(del);
      $fwdList.appendChild(row);
    });
  }

  $fwdAdd.addEventListener('click', () => {
    if (forwardTargets.length >= 16) { showToast('Max 16 targets', false); return; }
    forwardTargets.push({ host: '', port: 20777, enabled: true });
    renderForwardTargets();
  });

  // Poll status every 2 seconds
  async function pollStatus() {
    try {
      const r = await fetch('/api/status');
      if (!r.ok) return;
      const d = await r.json();
      $room.textContent = d.roomCode || '----';
      $eng.textContent = d.connectedEngineers;
      const enabled = !!d.ersCompareEnabled;
      $compareStatus.textContent = enabled ? 'UNLOCKED' : 'LOCKED';
      $compareStatus.className = 'compare-status ' + (enabled ? 'enabled' : 'disabled');
    } catch {}
  }

  // Load config once on page load
  async function loadConfig() {
    try {
      const r = await fetch('/api/config');
      if (!r.ok) return;
      const d = await r.json();
      $port.value = d.udpPort;
      $save.checked = d.saveFiles;
      $trackRec.checked = d.trackRecording;
      forwardTargets = Array.isArray(d.forwardTargets) ? d.forwardTargets : [];
      renderForwardTargets();
    } catch {}
  }

  // Save
  $btn.addEventListener('click', async () => {
    $btn.disabled = true;
    try {
      const r = await fetch('/api/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          udpPort: parseInt($port.value, 10),
          saveFiles: $save.checked,
          trackRecording: $trackRec.checked,
          forwardTargets: forwardTargets,
        }),
      });
      if (r.ok) {
        const d = await r.json();
        forwardTargets = Array.isArray(d.forwardTargets) ? d.forwardTargets : [];
        renderForwardTargets();
        showToast('Settings saved', true);
      } else {
        const d = await r.json().catch(() => ({}));
        showToast(d.error || 'Save failed', false);
      }
    } catch (e) {
      showToast('Network error', false);
    } finally {
      $btn.disabled = false;
    }
  });

  $unlockCompareBtn.addEventListener('click', async () => {
    $unlockCompareBtn.disabled = true;
    try {
      const r = await fetch('/api/ers-compare/unlock', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: $comparePassword.value }),
      });
      if (r.ok) {
        $comparePassword.value = '';
        showToast('ERS compare unlocked', true);
        pollStatus();
      } else {
        const d = await r.json().catch(() => ({}));
        showToast(d.error || 'Unlock failed', false);
      }
    } catch {
      showToast('Network error', false);
    } finally {
      $unlockCompareBtn.disabled = false;
    }
  });

  $lockCompareBtn.addEventListener('click', async () => {
    $lockCompareBtn.disabled = true;
    try {
      const r = await fetch('/api/ers-compare/lock', { method: 'POST' });
      if (r.ok) {
        $comparePassword.value = '';
        showToast('ERS compare locked', true);
        pollStatus();
      } else {
        showToast('Lock failed', false);
      }
    } catch {
      showToast('Network error', false);
    } finally {
      $lockCompareBtn.disabled = false;
    }
  });

  // Load tracks once on page load
  async function loadTracks() {
    try {
      const r = await fetch('/api/tracks');
      if (!r.ok) return;
      const tracks = await r.json();
      const loaded = tracks.filter(t => t.hasData).length;
      document.getElementById('tracksLoaded').textContent = loaded;
      document.getElementById('tracksTotal').textContent = ' / ' + tracks.length;

      const $list = document.getElementById('trackList');
      $list.innerHTML = '';
      tracks.sort((a, b) => a.name.localeCompare(b.name));
      for (const t of tracks) {
        const tag = document.createElement('span');
        tag.className = 'track-tag ' + (t.hasData ? 'ok' : 'missing');
        tag.textContent = t.name;
        $list.appendChild(tag);
      }
    } catch {}
  }

  loadConfig();
  loadTracks();
  pollStatus();
  setInterval(pollStatus, 2000);
</script>
</body>
</html>
