<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F1 Sender Settings</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #050505;
    color: #e0e0e0;
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 16px;
  }
  .container { width: 100%; max-width: 420px; }

  h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 1.3rem;
    color: #00d2ff;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 28px;
    text-align: center;
  }

  .section {
    background: #111;
    border: 1px solid #222;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.7rem;
    color: #666;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 16px;
  }

  /* Status */
  .room-code {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.4rem;
    font-weight: 700;
    color: #00d2ff;
    text-align: center;
    letter-spacing: 8px;
    margin-bottom: 12px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 6px 0;
    font-size: 1rem;
  }
  .stat-label { color: #888; }
  .stat-value { color: #e0e0e0; font-weight: 600; }

  /* Settings form */
  .field { margin-bottom: 16px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: #888;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .field input[type="number"],
  .field input[type="text"],
  .field input[type="password"] {
    width: 100%;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e0e0e0;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    font-weight: 600;
    padding: 8px 12px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input[type="number"]:focus,
  .field input[type="text"]:focus,
  .field input[type="password"]:focus {
    border-color: #00d2ff;
  }

  /* Toggle switch */
  .toggle-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .toggle {
    position: relative;
    width: 44px;
    height: 24px;
    cursor: pointer;
  }
  .toggle input { display: none; }
  .toggle .slider {
    position: absolute;
    inset: 0;
    background: #333;
    border-radius: 12px;
    transition: background 0.2s;
  }
  .toggle .slider::after {
    content: '';
    position: absolute;
    top: 3px;
    left: 3px;
    width: 18px;
    height: 18px;
    background: #888;
    border-radius: 50%;
    transition: transform 0.2s, background 0.2s;
  }
  .toggle input:checked + .slider {
    background: #00d2ff33;
  }
  .toggle input:checked + .slider::after {
    transform: translateX(20px);
    background: #00d2ff;
  }

  /* Tracks */
  .tracks-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .tracks-count {
    font-size: 1.1rem;
    font-weight: 600;
  }
  .tracks-count .loaded { color: #00d2ff; }
  .tracks-count .total { color: #666; }
  .track-list {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .track-tag {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 3px;
    font-weight: 600;
    letter-spacing: 0.3px;
  }
  .track-tag.ok {
    background: #00d2ff15;
    color: #00d2ff;
    border: 1px solid #00d2ff33;
  }
  .track-tag.missing {
    background: #e74c3c15;
    color: #e74c3c;
    border: 1px solid #e74c3c33;
  }
  .hidden { display: none !important; }
  .track-recording-note {
    margin-top: 8px;
    color: #6d6d6d;
    font-size: 0.82rem;
    line-height: 1.4;
  }
  .track-preview-card {
    margin-top: 16px;
    padding: 14px;
    border: 1px solid #23414d;
    border-radius: 8px;
    background:
      linear-gradient(180deg, rgba(9, 23, 29, 0.92), rgba(8, 14, 18, 0.95)),
      repeating-linear-gradient(
        45deg,
        rgba(255, 255, 255, 0.02) 0,
        rgba(255, 255, 255, 0.02) 2px,
        transparent 2px,
        transparent 7px
      );
  }
  .track-preview-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 12px;
  }
  .track-preview-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 0.82rem;
    color: #cfefff;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .track-preview-copy {
    margin-top: 4px;
    color: #8ba2ad;
    font-size: 0.84rem;
    line-height: 1.45;
  }
  .track-preview-names {
    display: grid;
    gap: 6px;
    margin-bottom: 12px;
  }
  .track-preview-name-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 10px;
    border: 1px solid #233743;
    border-radius: 6px;
    background: rgba(10, 21, 27, 0.82);
    font-size: 0.8rem;
    line-height: 1.35;
  }
  .track-preview-name-label {
    color: #7f97a1;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    white-space: nowrap;
  }
  .track-preview-name-value {
    color: #e3f6ff;
    font-weight: 700;
    text-align: right;
    word-break: break-word;
  }
  .track-preview-status {
    padding: 4px 8px;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    white-space: nowrap;
  }
  .track-preview-status.pending {
    color: #ffd166;
    border: 1px solid #ffd16655;
    background: #ffd16614;
  }
  .track-preview-status.ready {
    color: #79f2a3;
    border: 1px solid #79f2a355;
    background: #79f2a314;
  }
  .track-preview-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }
  .preview-chip {
    padding: 4px 8px;
    border-radius: 999px;
    border: 1px solid #35515f;
    color: #d6ebf5;
    background: #112029;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.4px;
  }
  .track-preview-legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .legend-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #8ba2ad;
    font-size: 0.76rem;
  }
  .legend-swatch {
    width: 10px;
    height: 10px;
    border-radius: 999px;
    display: inline-block;
  }
  .track-canvas-shell {
    border: 1px solid #223743;
    border-radius: 8px;
    background:
      radial-gradient(circle at 50% 20%, rgba(0, 210, 255, 0.08), transparent 55%),
      linear-gradient(180deg, rgba(4, 8, 11, 0.98), rgba(6, 10, 13, 0.94));
    min-height: 240px;
    padding: 8px;
  }
  .track-svg {
    width: 100%;
    height: 240px;
    display: block;
  }
  .track-preview-message {
    margin-top: 12px;
    color: #d8e8ee;
    font-size: 0.86rem;
    line-height: 1.45;
  }
  .track-preview-actions {
    margin-top: 12px;
    display: flex;
    gap: 8px;
  }
  .track-preview-actions .secondary-btn,
  .track-preview-actions .save-btn {
    margin: 0;
  }

  /* Forwarding */
  .fwd-list { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
  .fwd-row {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .fwd-row input[type="text"],
  .fwd-row input[type="number"] {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 4px;
    color: #e0e0e0;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 6px 8px;
    outline: none;
    transition: border-color 0.2s;
  }
  .fwd-row input[type="text"] { flex: 1; min-width: 0; }
  .fwd-row input[type="number"] { width: 80px; }
  .fwd-row input:focus { border-color: #00d2ff; }
  .fwd-del {
    background: transparent;
    border: 1px solid #e74c3c44;
    border-radius: 4px;
    color: #e74c3c;
    font-size: 1rem;
    width: 28px;
    height: 28px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .fwd-del:hover { background: #e74c3c22; }
  .fwd-add {
    background: transparent;
    border: 1px dashed #333;
    border-radius: 4px;
    color: #888;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.85rem;
    padding: 8px;
    cursor: pointer;
    text-align: center;
    transition: border-color 0.2s, color 0.2s;
  }
  .fwd-add:hover { border-color: #00d2ff; color: #00d2ff; }
  .fwd-empty {
    color: #555;
    font-size: 0.85rem;
    text-align: center;
    padding: 8px;
  }

  /* Save button */
  .save-btn {
    display: block;
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 1px solid #00d2ff;
    border-radius: 6px;
    color: #00d2ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s;
  }
  .save-btn:hover {
    background: #00d2ff;
    color: #050505;
  }
  .save-btn:disabled {
    opacity: 0.4;
    cursor: default;
  }
  .secondary-btn {
    display: block;
    width: 100%;
    padding: 10px 12px;
    background: transparent;
    border: 1px solid #444;
    border-radius: 6px;
    color: #bbb;
    font-family: 'Rajdhani', sans-serif;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .secondary-btn:hover {
    border-color: #00d2ff;
    color: #00d2ff;
    background: #00d2ff10;
  }
  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 0.9rem;
    opacity: 0;
    transition: transform 0.3s, opacity 0.3s;
    pointer-events: none;
    z-index: 100;
  }
  .toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }
  .toast.ok { border-color: #00d2ff; color: #00d2ff; }
  .toast.err { border-color: #e74c3c; color: #e74c3c; }
</style>
</head>
<body>
<div class="container">
  <h1>Sender Settings</h1>

  <!-- Status -->
  <div class="section">
    <div class="section-title">Status</div>
    <div class="room-code" id="roomCode">----</div>
    <div class="stat-row">
      <span class="stat-label">Room Name</span>
      <span class="stat-value" id="roomNameStatus">--</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Access</span>
      <span class="stat-value" id="roomProtectedStatus">OPEN</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Connected Engineers</span>
      <span class="stat-value" id="engineers">0</span>
    </div>
    <div style="margin-top:14px;text-align:center;">
      <button id="radarBtn" style="
        background:#1a1a1a;border:1px solid #00d2ff33;border-radius:4px;
        color:#00d2ff;font-family:'Orbitron',sans-serif;font-size:0.65rem;
        letter-spacing:1.5px;text-transform:uppercase;padding:8px 20px;
        cursor:pointer;transition:background 0.2s,border-color 0.2s;
      " onmouseover="this.style.background='#00d2ff15';this.style.borderColor='#00d2ff'"
         onmouseout="this.style.background='#1a1a1a';this.style.borderColor='#00d2ff33'"
         onclick="toggleRadar()">
        Radar Overlay
      </button>
    </div>
  </div>

  <!-- Settings -->
  <div class="section">
    <div class="section-title">Settings</div>
    <div class="field">
      <label for="udpPort">UDP Port</label>
      <input type="number" id="udpPort" min="1" max="65535">
    </div>
    <div class="field">
      <label for="roomName">Room Name</label>
      <input type="text" id="roomName" maxlength="48" placeholder="Sender Room">
    </div>
    <div class="field">
      <label for="roomPassword">Room Password</label>
      <input type="password" id="roomPassword" maxlength="64" placeholder="Optional room password">
    </div>
    <div class="field">
      <div class="toggle-row">
        <label>Save Files</label>
        <label class="toggle">
          <input type="checkbox" id="saveFiles">
          <span class="slider"></span>
        </label>
      </div>
    </div>
    <div class="field">
      <div class="toggle-row">
        <label>Track Recording</label>
        <label class="toggle">
          <input type="checkbox" id="trackRecording">
          <span class="slider"></span>
        </label>
      </div>
      <div class="track-recording-note" id="trackRecordingNote">
        Waiting for current track session.
      </div>
      <div class="track-preview-card hidden" id="trackPreviewCard">
        <div class="track-preview-head">
          <div>
            <div class="track-preview-title" id="trackPreviewTitle">Existing Track Data</div>
            <div class="track-preview-copy" id="trackPreviewCopy"></div>
          </div>
          <span class="track-preview-status pending" id="trackPreviewStatus">Review</span>
        </div>
        <div class="track-preview-names">
          <div class="track-preview-name-row">
            <span class="track-preview-name-label">Current Track</span>
            <span class="track-preview-name-value" id="trackPreviewCurrentName">--</span>
          </div>
          <div class="track-preview-name-row">
            <span class="track-preview-name-label">Saved Track</span>
            <span class="track-preview-name-value" id="trackPreviewSavedName">--</span>
          </div>
        </div>
        <div class="track-preview-meta" id="trackPreviewMeta"></div>
        <div class="track-preview-legend">
          <span class="legend-chip"><span class="legend-swatch" style="background:#43d4ff"></span>Sector 1</span>
          <span class="legend-chip"><span class="legend-swatch" style="background:#ff9f43"></span>Sector 2</span>
          <span class="legend-chip"><span class="legend-swatch" style="background:#d6ff4d"></span>Sector 3</span>
          <span class="legend-chip"><span class="legend-swatch" style="background:#00d2ff"></span>DRS</span>
          <span class="legend-chip"><span class="legend-swatch" style="background:#ffffff"></span>Turn #</span>
        </div>
        <div class="track-canvas-shell">
          <svg class="track-svg" id="trackPreviewSvg" viewBox="0 0 320 240" preserveAspectRatio="xMidYMid meet"></svg>
        </div>
        <div class="track-preview-message" id="trackPreviewMessage"></div>
        <div class="track-preview-actions">
          <button class="secondary-btn" id="keepExistingTrackBtn" type="button">Keep Existing</button>
          <button class="save-btn" id="approveOverwriteBtn" type="button">Overwrite</button>
        </div>
      </div>
    </div>
  </div>

  <!-- UDP Forwarding -->
  <div class="section">
    <div class="section-title">UDP Forwarding</div>
    <div class="fwd-list" id="fwdList"></div>
    <button class="fwd-add" id="fwdAdd">+ Add Target</button>
  </div>

  <!-- Tracks -->
  <div class="section">
    <div class="section-title">Tracks</div>
    <div class="tracks-summary">
      <span class="stat-label">Track Data</span>
      <span class="tracks-count"><span class="loaded" id="tracksLoaded">0</span><span class="total" id="tracksTotal"> / 0</span></span>
    </div>
    <div class="track-list" id="trackList"></div>
  </div>


  <button class="save-btn" id="saveBtn">Save</button>
</div>

<div class="toast" id="toast"></div>

<script>
  const $room = document.getElementById('roomCode');
  const $roomNameStatus = document.getElementById('roomNameStatus');
  const $roomProtectedStatus = document.getElementById('roomProtectedStatus');
  const $eng  = document.getElementById('engineers');
  const $port = document.getElementById('udpPort');
  const $roomName = document.getElementById('roomName');
  const $roomPassword = document.getElementById('roomPassword');
  const $save = document.getElementById('saveFiles');
  const $trackRec = document.getElementById('trackRecording');
  const $btn  = document.getElementById('saveBtn');
  const $toast = document.getElementById('toast');
  const $fwdList = document.getElementById('fwdList');
  const $fwdAdd = document.getElementById('fwdAdd');
  const $trackRecordingNote = document.getElementById('trackRecordingNote');
  const $trackPreviewCard = document.getElementById('trackPreviewCard');
  const $trackPreviewTitle = document.getElementById('trackPreviewTitle');
  const $trackPreviewCopy = document.getElementById('trackPreviewCopy');
  const $trackPreviewStatus = document.getElementById('trackPreviewStatus');
  const $trackPreviewCurrentName = document.getElementById('trackPreviewCurrentName');
  const $trackPreviewSavedName = document.getElementById('trackPreviewSavedName');
  const $trackPreviewMeta = document.getElementById('trackPreviewMeta');
  const $trackPreviewSvg = document.getElementById('trackPreviewSvg');
  const $trackPreviewMessage = document.getElementById('trackPreviewMessage');
  const $approveOverwriteBtn = document.getElementById('approveOverwriteBtn');
  const $keepExistingTrackBtn = document.getElementById('keepExistingTrackBtn');

  let forwardTargets = [];
  let currentTrack = null;
  let currentTrackPreview = null;
  let currentTrackKey = '';
  let approvedOverwriteFilename = '';
  let overwriteReviewRequired = false;
  let savedTrackRecording = false;

  let toastTimer;
  function showToast(msg, ok) {
    clearTimeout(toastTimer);
    $toast.textContent = msg;
    $toast.className = 'toast ' + (ok ? 'ok' : 'err') + ' show';
    toastTimer = setTimeout(() => { $toast.className = 'toast'; }, 2500);
  }

  function formatSignedPP(value, digits = 0) {
    const scale = 10 ** digits;
    const rounded = Math.round(value * scale) / scale;
    const text = digits > 0 ? rounded.toFixed(digits) : String(Math.round(rounded));
    return (rounded > 0 ? '+' : '') + text + 'pp';
  }

  function formatRate(value) {
    return Math.round(value * 10) / 10 + '%';
  }

  function formatPP(value) {
    return (Math.round(value * 10) / 10).toFixed(1) + 'pp';
  }

  function formatTrackName(name) {
    if (!name) return 'UNKNOWN';
    return name.replace(/_/g, ' ').toUpperCase();
  }

  function getSectorColor(sector) {
    if (sector === 0) return '#43d4ff';
    if (sector === 1) return '#ff9f43';
    return '#d6ff4d';
  }

  function projectTrackPoint(point, bounds, width, height, padding) {
    const spanX = Math.max(bounds.maxX - bounds.minX, 1);
    const spanZ = Math.max(bounds.maxZ - bounds.minZ, 1);
    const scale = Math.min((width - padding * 2) / spanX, (height - padding * 2) / spanZ);
    const contentWidth = spanX * scale;
    const contentHeight = spanZ * scale;
    const offsetX = (width - contentWidth) / 2;
    const offsetY = (height - contentHeight) / 2;
    const x = offsetX + (point.x - bounds.minX) * scale;
    const y = height - (offsetY + (point.z - bounds.minZ) * scale);
    return { x, y };
  }

  function buildTrackSegments(points, keyFn) {
    if (!Array.isArray(points) || points.length < 2) return [];
    const segments = [];
    let start = 0;
    let currentKey = keyFn(points[0]);
    for (let i = 1; i < points.length; i += 1) {
      const nextKey = keyFn(points[i]);
      if (nextKey !== currentKey) {
        segments.push({ start, end: i, key: currentKey });
        start = Math.max(0, i - 1);
        currentKey = nextKey;
      }
    }
    segments.push({ start, end: points.length - 1, key: currentKey });
    return segments.filter((segment) => segment.end - segment.start >= 1);
  }

  function inferTurnMarkers(points) {
    if (!Array.isArray(points) || points.length < 30) return [];
    const stride = Math.max(2, Math.floor(points.length / 500));
    const gap = Math.max(20, Math.floor(points.length / 18));
    const candidates = [];
    for (let i = stride * 2; i < points.length - stride * 2; i += stride) {
      const a = points[i - stride * 2];
      const b = points[i];
      const c = points[i + stride * 2];
      const v1x = b.x - a.x;
      const v1y = b.z - a.z;
      const v2x = c.x - b.x;
      const v2y = c.z - b.z;
      const len1 = Math.hypot(v1x, v1y);
      const len2 = Math.hypot(v2x, v2y);
      if (len1 < 1 || len2 < 1) continue;
      const dot = Math.max(-1, Math.min(1, (v1x * v2x + v1y * v2y) / (len1 * len2)));
      const angle = Math.acos(dot);
      if (angle < 0.22) continue;
      const curvature = angle / (len1 + len2);
      candidates.push({
        index: i,
        score: angle * 0.8 + curvature * 120,
      });
    }
    candidates.sort((a, b) => b.score - a.score);
    const selected = [];
    for (const candidate of candidates) {
      if (selected.some((marker) => Math.abs(marker.index - candidate.index) < gap)) continue;
      selected.push(candidate);
      if (selected.length >= 20) break;
    }
    selected.sort((a, b) => a.index - b.index);
    return selected.map((marker, index) => ({
      number: index + 1,
      point: points[marker.index],
    }));
  }

  function countDrsZones(points) {
    let zones = 0;
    let active = false;
    for (const point of points || []) {
      const on = Number(point.drs) > 0;
      if (on && !active) zones += 1;
      active = on;
    }
    return zones;
  }

  function renderTrackPreviewSvg(trackMap) {
    if (!trackMap || !Array.isArray(trackMap.points) || trackMap.points.length < 2) {
      $trackPreviewSvg.innerHTML = '';
      return;
    }

    const width = 320;
    const height = 240;
    const padding = 18;
    const points = trackMap.points;
    const bounds = {
      minX: trackMap.minX,
      maxX: trackMap.maxX,
      minZ: trackMap.minZ,
      maxZ: trackMap.maxZ,
    };

    const toSvg = (point) => projectTrackPoint(point, bounds, width, height, padding);
    const polyline = (segment) => points
      .slice(segment.start, segment.end + 1)
      .map((point) => {
        const projected = toSvg(point);
        return `${projected.x.toFixed(1)},${projected.y.toFixed(1)}`;
      })
      .join(' ');

    const sectorSegments = buildTrackSegments(points, (point) => Number(point.sector) || 0);
    const drsSegments = buildTrackSegments(points, (point) => (Number(point.drs) > 0 ? 1 : 0)).filter((segment) => segment.key === 1);
    const turnMarkers = inferTurnMarkers(points);
    const sectorLabels = [];
    const seenSectors = new Set();
    for (const point of points) {
      const sector = Number(point.sector) || 0;
      if (seenSectors.has(sector)) continue;
      seenSectors.add(sector);
      sectorLabels.push({ sector, point });
      if (seenSectors.size >= 3) break;
    }

    const basePath = points.map((point) => {
      const projected = toSvg(point);
      return `${projected.x.toFixed(1)},${projected.y.toFixed(1)}`;
    }).join(' ');

    const sectorMarkup = sectorSegments.map((segment) => (
      `<polyline points="${polyline(segment)}" fill="none" stroke="${getSectorColor(segment.key)}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />`
    )).join('');

    const drsMarkup = drsSegments.map((segment) => (
      `<polyline points="${polyline(segment)}" fill="none" stroke="#00d2ff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.22" />`
    )).join('');

    const labelMarkup = sectorLabels.map((label) => {
      const projected = toSvg(label.point);
      return `<g transform="translate(${projected.x.toFixed(1)} ${projected.y.toFixed(1)})">
        <rect x="-12" y="-11" width="24" height="16" rx="8" fill="#081218" stroke="${getSectorColor(label.sector)}" stroke-width="1" />
        <text x="0" y="0" fill="#dff8ff" font-size="9" font-family="Orbitron, sans-serif" text-anchor="middle" dominant-baseline="central">S${label.sector + 1}</text>
      </g>`;
    }).join('');

    const turnsMarkup = turnMarkers.map((marker) => {
      const projected = toSvg(marker.point);
      return `<g transform="translate(${projected.x.toFixed(1)} ${projected.y.toFixed(1)})">
        <circle r="8" fill="#ffffff" fill-opacity="0.9" stroke="#041014" stroke-width="1.5" />
        <text x="0" y="0.5" fill="#041014" font-size="8" font-family="Orbitron, sans-serif" text-anchor="middle" dominant-baseline="central">${marker.number}</text>
      </g>`;
    }).join('');

    $trackPreviewSvg.innerHTML = `
      <rect x="0" y="0" width="${width}" height="${height}" rx="12" fill="transparent" />
      <polyline points="${basePath}" fill="none" stroke="#223640" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
      ${drsMarkup}
      ${sectorMarkup}
      ${labelMarkup}
      ${turnsMarkup}
    `;
  }

  function renderTrackPreview() {
    const currentName = currentTrack?.name;
    if (!currentName) {
      $trackPreviewCurrentName.textContent = '--';
      $trackPreviewSavedName.textContent = '--';
      $trackRecordingNote.textContent = 'Waiting for current track session.';
      $trackPreviewCard.classList.add('hidden');
      return;
    }

    if (!currentTrackPreview?.available || !currentTrackPreview.preview) {
      $trackPreviewCurrentName.textContent = formatTrackName(currentName);
      $trackPreviewSavedName.textContent = '--';
      $trackRecordingNote.textContent = `Current track: ${formatTrackName(currentName)}. No recorded file will be overwritten.`;
      $trackPreviewCard.classList.add('hidden');
      return;
    }

    const preview = currentTrackPreview.preview;
    const pointCount = preview.trackMap?.points?.length || 0;
    const drsZones = countDrsZones(preview.trackMap?.points || []);
    const approved = approvedOverwriteFilename === preview.filename;

    $trackRecordingNote.textContent = `Current track: ${formatTrackName(currentName)}. Existing recorded data was found.`;
    $trackPreviewCard.classList.remove('hidden');
    $trackPreviewTitle.textContent = `${formatTrackName(preview.name)} recorded data`;
    $trackPreviewCopy.textContent = `${preview.filename} is already on disk. Review the layout before recording over it.`;
    $trackPreviewCurrentName.textContent = formatTrackName(currentName);
    $trackPreviewSavedName.textContent = formatTrackName(preview.name);
    $trackPreviewStatus.textContent = overwriteReviewRequired && !approved ? 'Review' : approved ? 'Approved' : 'Detected';
    $trackPreviewStatus.className = 'track-preview-status ' + ((overwriteReviewRequired && !approved) ? 'pending' : 'ready');
    $trackPreviewMeta.innerHTML = `
      <span class="preview-chip">${pointCount.toLocaleString()} pts</span>
      <span class="preview-chip">DRS ${drsZones}</span>
      <span class="preview-chip">Sectors 3</span>
      <span class="preview-chip">Turns ${inferTurnMarkers(preview.trackMap?.points || []).length}</span>
    `;
    $trackPreviewMessage.textContent = approved
      ? 'Overwrite is approved for the current track. Save the settings to arm track recording.'
      : '현재 저장된 트랙 데이터입니다. 새 기록을 시작하면 이 파일을 덮어쓸 수 있습니다. 계속할지 먼저 확인하세요.';
    renderTrackPreviewSvg(preview.trackMap);
  }

  async function loadCurrentTrackPreview() {
    try {
      const r = await fetch('/api/tracks/current-preview');
      if (!r.ok) return;
      currentTrackPreview = await r.json();
      renderTrackPreview();
    } catch {}
  }

  // Forward targets UI
  function renderForwardTargets() {
    $fwdList.innerHTML = '';
    if (forwardTargets.length === 0) {
      const empty = document.createElement('div');
      empty.className = 'fwd-empty';
      empty.textContent = 'No forwarding targets';
      $fwdList.appendChild(empty);
      return;
    }
    forwardTargets.forEach((t, i) => {
      const row = document.createElement('div');
      row.className = 'fwd-row';

      const toggle = document.createElement('label');
      toggle.className = 'toggle';
      toggle.style.flexShrink = '0';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.checked = t.enabled;
      cb.addEventListener('change', () => { forwardTargets[i].enabled = cb.checked; });
      const slider = document.createElement('span');
      slider.className = 'slider';
      toggle.appendChild(cb);
      toggle.appendChild(slider);

      const host = document.createElement('input');
      host.type = 'text';
      host.value = t.host;
      host.placeholder = 'Host / IP';
      host.addEventListener('input', () => { forwardTargets[i].host = host.value; });

      const port = document.createElement('input');
      port.type = 'number';
      port.min = '1';
      port.max = '65535';
      port.value = t.port;
      port.placeholder = 'Port';
      port.addEventListener('input', () => { forwardTargets[i].port = parseInt(port.value, 10) || 0; });

      const del = document.createElement('button');
      del.className = 'fwd-del';
      del.textContent = '\u00d7';
      del.addEventListener('click', () => { forwardTargets.splice(i, 1); renderForwardTargets(); });

      row.appendChild(toggle);
      row.appendChild(host);
      row.appendChild(port);
      row.appendChild(del);
      $fwdList.appendChild(row);
    });
  }

  $fwdAdd.addEventListener('click', () => {
    if (forwardTargets.length >= 16) { showToast('Max 16 targets', false); return; }
    forwardTargets.push({ host: '', port: 20777, enabled: true });
    renderForwardTargets();
  });

  // Poll status every 2 seconds
  async function pollStatus() {
    try {
      const r = await fetch('/api/status');
      if (!r.ok) return;
      const d = await r.json();
      $room.textContent = d.roomCode || '----';
      $roomNameStatus.textContent = d.roomName || '--';
      $roomProtectedStatus.textContent = d.roomProtected ? 'LOCKED' : 'OPEN';
      $eng.textContent = d.connectedEngineers;

      const nextTrack = d.currentTrack || null;
      const nextTrackKey = nextTrack ? `${nextTrack.id}:${nextTrack.name}:${nextTrack.filename || ''}:${nextTrack.hasRecordedPreview ? 1 : 0}` : '';
      if (nextTrackKey !== currentTrackKey) {
        currentTrackKey = nextTrackKey;
        currentTrack = nextTrack;
        currentTrackPreview = null;
        approvedOverwriteFilename = '';
        overwriteReviewRequired = false;
        if (currentTrack) {
          loadCurrentTrackPreview();
        } else {
          renderTrackPreview();
        }
      }

      updateRadarBtn(!!d.radarActive);
    } catch {}
  }

  // Load config once on page load
  async function loadConfig() {
    try {
      const r = await fetch('/api/config');
      if (!r.ok) return;
      const d = await r.json();
      $port.value = d.udpPort;
      $roomName.value = d.roomName || '';
      $roomPassword.value = d.roomPassword || '';
      $save.checked = d.saveFiles;
      $trackRec.checked = d.trackRecording;
      savedTrackRecording = !!d.trackRecording;
      forwardTargets = Array.isArray(d.forwardTargets) ? d.forwardTargets : [];
      renderForwardTargets();
    } catch {}
  }

  // Save
  $btn.addEventListener('click', async () => {
    if ($trackRec.checked && !savedTrackRecording && currentTrackPreview?.available && currentTrackPreview.preview && approvedOverwriteFilename !== currentTrackPreview.preview.filename) {
      overwriteReviewRequired = true;
      renderTrackPreview();
      showToast('Review the existing track data before enabling overwrite', false);
      return;
    }
    $btn.disabled = true;
    try {
      const r = await fetch('/api/config', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          udpPort: parseInt($port.value, 10),
          roomName: $roomName.value,
          roomPassword: $roomPassword.value,
          saveFiles: $save.checked,
          trackRecording: $trackRec.checked,
          trackRecordingOverwriteApprovedFor: approvedOverwriteFilename,
          forwardTargets: forwardTargets,
        }),
      });
      if (r.ok) {
        const d = await r.json();
        forwardTargets = Array.isArray(d.forwardTargets) ? d.forwardTargets : [];
        savedTrackRecording = !!d.trackRecording;
        renderForwardTargets();
        if (!$trackRec.checked) {
          approvedOverwriteFilename = '';
          overwriteReviewRequired = false;
          renderTrackPreview();
        }
        showToast('Settings saved', true);
      } else {
        const d = await r.json().catch(() => ({}));
        if (r.status === 409 && d.requiresOverwriteConfirm) {
          overwriteReviewRequired = true;
          currentTrack = d.currentTrack || currentTrack;
          if (currentTrack) {
            currentTrackKey = `${currentTrack.id}:${currentTrack.name}:${currentTrack.filename || ''}:${currentTrack.hasRecordedPreview ? 1 : 0}`;
            await loadCurrentTrackPreview();
          } else {
            renderTrackPreview();
          }
        }
        showToast(d.error || 'Save failed', false);
      }
    } catch (e) {
      showToast('Network error', false);
    } finally {
      $btn.disabled = false;
    }
  });

  // Load tracks once on page load
  async function loadTracks() {
    try {
      const r = await fetch('/api/tracks');
      if (!r.ok) return;
      const tracks = await r.json();
      const loaded = tracks.filter(t => t.hasData).length;
      document.getElementById('tracksLoaded').textContent = loaded;
      document.getElementById('tracksTotal').textContent = ' / ' + tracks.length;

      const $list = document.getElementById('trackList');
      $list.innerHTML = '';
      tracks.sort((a, b) => a.name.localeCompare(b.name));
      for (const t of tracks) {
        const tag = document.createElement('span');
        tag.className = 'track-tag ' + (t.hasData ? 'ok' : 'missing');
        tag.textContent = t.name;
        $list.appendChild(tag);
      }
    } catch {}
  }

  $trackRec.addEventListener('change', () => {
    if (!$trackRec.checked) {
      approvedOverwriteFilename = '';
      overwriteReviewRequired = false;
      renderTrackPreview();
      return;
    }
    if (!savedTrackRecording && currentTrackPreview?.available && currentTrackPreview.preview && approvedOverwriteFilename !== currentTrackPreview.preview.filename) {
      $trackRec.checked = false;
      overwriteReviewRequired = true;
      renderTrackPreview();
      showToast('Existing track data detected. Review before overwriting.', false);
    }
  });

  $approveOverwriteBtn.addEventListener('click', () => {
    const filename = currentTrackPreview?.preview?.filename;
    if (!filename) return;
    approvedOverwriteFilename = filename;
    overwriteReviewRequired = false;
    $trackRec.checked = true;
    renderTrackPreview();
    showToast('Overwrite approved. Save settings to arm recording.', true);
  });

  $keepExistingTrackBtn.addEventListener('click', () => {
    approvedOverwriteFilename = '';
    overwriteReviewRequired = false;
    $trackRec.checked = false;
    renderTrackPreview();
    showToast('Existing track data kept.', true);
  });

  // Radar overlay toggle
  async function toggleRadar() {
    try {
      const res = await fetch('/api/radar/toggle', { method: 'POST' });
      const data = await res.json();
      updateRadarBtn(data.active);
      showToast(data.active ? 'Radar overlay opened' : 'Radar overlay closed', true);
    } catch { showToast('Failed to toggle radar', false); }
  }
  function updateRadarBtn(active) {
    const btn = document.getElementById('radarBtn');
    if (active) {
      btn.style.borderColor = '#00d2ff';
      btn.style.background = '#00d2ff20';
      btn.textContent = 'Close Radar';
    } else {
      btn.style.borderColor = '#00d2ff33';
      btn.style.background = '#1a1a1a';
      btn.textContent = 'Radar Overlay';
    }
  }
  loadConfig();
  loadTracks();
  pollStatus();
  setInterval(pollStatus, 2000);
</script>
</body>
</html>
