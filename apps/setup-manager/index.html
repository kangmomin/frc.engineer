<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRC Setup Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { min-height: 100vh; width: 100%; }
      html { overflow: hidden; }
      body, #root { overflow-y: auto; overflow-x: hidden; }
      body {
        font-family: 'Inter', sans-serif;
        background: #131314;
        color: #e5e2e3;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      ::-webkit-scrollbar { width: 5px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(0,229,255,0.15); border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(0,229,255,0.3); }
      ::selection { background: rgba(0,229,255,0.25); color: #fff; }
      input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; cursor: pointer; }
      input[type="range"]::-webkit-slider-track { height: 3px; background: rgba(255,255,255,0.06); border-radius: 2px; }
      input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #00e5ff; margin-top: -4.5px; box-shadow: 0 0 8px rgba(0,229,255,0.4); }
      .electron-drag { -webkit-app-region: drag; height: 32px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; pointer-events: none; }
    </style>
  </head>
  <body>
    <div class="electron-drag"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
