<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FRC Setup Manager</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body, #root { min-height: 100vh; width: 100%; }
      body {
        font-family: system-ui, -apple-system, sans-serif;
        background: #0a0e1a;
        color: #f1f5f9;
        -webkit-font-smoothing: antialiased;
      }
      /* Electron title bar drag region */
      .electron-drag { -webkit-app-region: drag; height: 36px; position: fixed; top: 0; left: 0; right: 0; z-index: 9999; }
      .electron-drag button, .electron-drag input, .electron-drag a { -webkit-app-region: no-drag; }
    </style>
  </head>
  <body>
    <div class="electron-drag"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
